name: 최근 블로그 글 갱신
on:
  schedule:
    - cron: "30 15 * * *" # 매일 00:30 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.kebi.dev/rss.xml"
          max_post_count: 5
          template: "- [$title]($url) <sub>$date</sub>$newline"
          date_format: "yyyy.mm.dd"
          commit_message: "최근 블로그 글 갱신"
          committer_username: "kebi3477"
          committer_email: "kebi3477@naver.com"
